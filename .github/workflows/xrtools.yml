# Builds the Godot XR Tools demo (MIT, Bastiaan Olij and contributors) for the
# HyperMagic OpenXR runtime from source (ports/xrtools) and publishes the APK on its own release,
# which the HyperMagic store downloads.
name: XR Tools Demo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. xrtools-v4.4.0)"
        required: true
        default: "xrtools-v4.4.0"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" > /dev/null

      - name: Build
        run: JAVA17_HOME="$JAVA_HOME" ports/xrtools/build.sh "$RUNNER_TEMP/xrtools"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Godot XR Tools Demo 4.4.0 (HyperMagic)
          make_latest: false
          body: |
            Godot XR Tools Demo (MIT, Bastiaan Olij e colaboradores): o playground de VR do Godot (andar, escalar, pegar e jogar objetos, atirar, voar), compilado do código-fonte para o runtime OpenXR do HyperMagic. Baixe pela aba Importar e jogar do HyperMagic. Detalhes em ports/xrtools.
          files: ports/xrtools/dist/XRToolsDemo-4.4.0-arm64.apk
