# Builds Open Saber (MIT, leandrodreamer's Godot 4.3 / OpenXR port of Beep Saber) for the
# HyperMagic OpenXR runtime from source (ports/opensaber) and publishes the APK on its own release,
# which the HyperMagic store downloads.
name: Open Saber

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. opensaber-v0.5.0)"
        required: true
        default: "opensaber-v0.5.0"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build
        run: JAVA17_HOME="$JAVA_HOME" ports/opensaber/build.sh "$RUNNER_TEMP/opensaber"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Open Saber 0.5.0 (HyperMagic)
          make_latest: false
          body: |
            Open Saber, o jogo de ritmo com sabres de luz (MIT, leandrodreamer, port para Godot 4 do Beep Saber de NeoSpark314), compilado do código-fonte para o runtime OpenXR do HyperMagic. Baixe pela Loja do HyperMagic. Detalhes em ports/opensaber.
          files: ports/opensaber/dist/OpenSaber-0.5.0-arm64.apk
