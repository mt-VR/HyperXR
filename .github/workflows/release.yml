# Builds the phone APK (arm64) and publishes it on the Releases page when a version tag is
# pushed (v0.2.0, v0.3.0...). It can also be started by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK, NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :core:test --no-daemon

      # the PC side of SteamVR streaming: the driver and the app, built with MinGW-w64; the
      # protocol test checks it reads the phone's bytes (golden files from the core tests)
      - name: PC (SteamVR driver and app)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64 zip > /dev/null
          g++ -std=c++17 -o hxvr_test pc/tests/protocol_test.cpp && ./hxvr_test pc/tests/golden
          sh pc/build.sh

      - name: APK (arm64)
        run: |
          ./gradlew :app:assembleDebug -PhxAbi=arm64-v8a --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk HyperMagic-arm64.apk

      # phones with a 32-bit Android refuse an arm64-only APK ("invalid package")
      - name: APK (32-bit ARM)
        run: |
          ./gradlew :app:assembleDebug -PhxAbi=armeabi-v7a --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk HyperMagic-armv7.apk

      - name: Name the APKs
        id: names
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mv HyperMagic-arm64.apk "HyperMagic-$TAG-arm64.apk"
          mv HyperMagic-armv7.apk "HyperMagic-$TAG-armv7.apk"
          cp pc/dist/HyperXR-PC.zip "HyperMagic-PC-$TAG.zip"
          NOTES="docs/releases/$TAG.md"
          [ -f "$NOTES" ] || NOTES=README.md
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.names.outputs.tag }}
          name: HyperMagic ${{ steps.names.outputs.tag }}
          body_path: ${{ steps.names.outputs.notes }}
          files: |
            HyperMagic-${{ steps.names.outputs.tag }}-arm64.apk
            HyperMagic-${{ steps.names.outputs.tag }}-armv7.apk
            HyperMagic-PC-${{ steps.names.outputs.tag }}.zip
